# Для тех, у кого на сервере уже есть nginx с HTTPS.
# Вставьте внутрь существующего блока server { listen 443 ssl; ... }
# и замените SECRET на случайную строку (openssl rand -hex 12).
location = /alice-SECRET {
  proxy_pass http://127.0.0.1:8090/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 10s;
  client_max_body_size 64k;
  access_log off;
}
